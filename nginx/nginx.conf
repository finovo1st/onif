upstream finovo_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name finovo1.com www.finovo1.com _;

    # Maximum upload size for deposit receipts and KYC IDs
    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. Django Backend API, Admin, and Health Check
    location ~ ^/(api|admin|health) {
        proxy_pass http://finovo_backend;
        proxy_set_header Host $host;
        # Restore real client IP forwarded by Cloudflare
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Informs Django that client connected via HTTPS at Cloudflare Edge
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # 2. Django Static Files (Aggressively cached by browser & Cloudflare CDN)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 3. Django Media Files (KYC documents & deposit proofs)
    location /media/ {
        alias /app/media/;
        # Block execution of malicious scripts in uploads directory
        location ~ \.(php|py|sh|pl|cgi|exe|bat)$ {
            deny all;
        }
    }

    # 4. App Portal Routes
    location = /app {
        root /usr/share/nginx/html;
        try_files /app.html =404;
    }

    location = /download {
        root /usr/share/nginx/html;
        try_files /download.html =404;
    }

    location = /register {
        return 302 /app.html#register;
    }

    location = /login {
        return 302 /app.html#login;
    }

    # 5. Frontend Application (Serves landing page at root index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

